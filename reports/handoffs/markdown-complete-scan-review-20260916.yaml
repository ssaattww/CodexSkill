findings: &id008
- id: R81-01
  severity: medium
  priority: P2
  origin: introduced_by_change
  location: skills/review-enforcer/scripts/check-markdown-whitelist-sudachi.py:517-525
  description: 分割境界をまたぐ未登録の片仮名語が見逃される。
  impact: 文書中の位置だけで許可一覧違反の検出結果が変わり、検査が誤って成功する。
  evidence: 「あ」15999文字 + 「ギア」 + 「あ」10文字（48033 bytes）を --stdin probe.md に渡すと、base は exit 1 でギアを検出し、HEAD は exit 0。同じ本文の先頭に「あ」を1文字加えると
    HEAD も exit 1。11種類の再結合確認は通るが、語の判定は保持されていない。
  required_action: 分割境界周辺の語を元の文脈で検査できる方式にし、語を保持できない場合を成功扱いにしない。2文字語・長い片仮名語・境界前後の位置と行番号を確認する。
- id: R81-02
  severity: medium
  priority: P2
  origin: introduced_by_change
  location: skills/review-enforcer/scripts/run-cspell-markdown.js:89-90
  description: 登録済みの英語複合語に漢字が隣接すると cspell が誤検出する。
  impact: 許可された識別子を日本語文中で使えなくなり、Python の許可判定と cspell の判定が食い違う。
  evidence: Tracker.DebugHost を許可した状態で、Tracker.DebugHost構成 と 構成Tracker.DebugHost は base cspell が exit 0、HEAD cspell
    が exit 1（Tracker / Debug / Host を拒否）。HEAD Python は同じ入力を exit 0 にする。ひらがな隣接の Tracker.DebugHostと は成功する。
  required_action: 英語識別子の継続文字と日本語本文の境界を区別し、登録語の漢字隣接を許可しつつ Tracker.DebugHostx は拒否する。前後両側と Python/cspell の組合せを確認する。
- id: R81-03
  severity: medium
  priority: P2
  origin: introduced_by_change
  location: skills/review-enforcer/scripts/check-markdown-whitelist-sudachi.py:21
  description: --files で明示指定した .txt が無警告で検査対象から捨てられる。
  impact: 使用者が指定したファイルを検査していないのに成功を返す。help は引き続き .md/.txt 対応と案内している。
  evidence: 未登録語 qzxvunknownword を含む note.txt に --files note.txt を実行すると base は exit 1、HEAD は stderr 空の exit 0。同じ内容の
    note.md は HEAD でも exit 1。
  required_action: 暗黙探索から .txt を除外する方針は維持できるが、明示指定時は検査するか非対応をエラーとして返す。--files / --changed の help と実際の契約を同期する。
- id: R81-04
  severity: medium
  priority: P2
  origin: pre_existing
  location: skills/review-enforcer/scripts/check-markdown-whitelist-sudachi.py:393-394; skills/review-enforcer/scripts/run-cspell-markdown.js:89-90
  description: 複合語の境界修正後も、ドット・ハイフンによる未登録の連結語が通る。
  impact: 登録した複合語だけを許可する契約に対して、登録語を連結した未登録の識別子まで許可される。
  evidence: Tracker.DebugHost を許可すると、未登録の Tracker.DebugHost.Tracker.DebugHost と Tracker.DebugHost-Tracker.DebugHost
    が HEAD の Python/cspell とも exit 0。英語検出の ENGLISH_RE はこれらを1語として扱うが、その前に部分語がマスクされる。base cspell でも成功するため、新規退行ではなく今回の境界厳密化に残る既存欠陥。
  required_action: 英語語彙の継続子として使う . / - と文末の句読点を区別し、未登録の全体語を部分マスクしない。単独登録語、文末ピリオド、ドット・ハイフン・アンダースコアでの連結を両検査器で確認する。
