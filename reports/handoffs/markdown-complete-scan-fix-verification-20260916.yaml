      106ea5でもexit 0のためpre-existing。


      **必要な対応:** 片仮名判定をraw surfaceだけで早期終了せずNFKC/normalized formを考慮し、半角片仮名も未登録なら拒否する。長文分割の片仮名境界判定も同じ正規化契約に揃え、全角/半角と分割境界の組合せを確認する。


      設計は英字語と片仮名語を語彙対象としている。current HEADでは全角`コンピューター`は未登録違反になる一方、半角`ｺﾝﾋﾟｭｰﾀｰ`は無診断でexit 0。SudachiPy自体は後者をnormalized form `コンピューター`の名詞として返すため、tokenizerではなく`should_check_japanese`のraw-surface早期終了が検査漏れの原因である。cspellは全角/半角ともexit
