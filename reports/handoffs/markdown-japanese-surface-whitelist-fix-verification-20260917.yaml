      \ 0であり、新規退行ではない。今回の追加要件に対するfixture不足として `coverage_miss` に分類する。\n\n**必要な対応:** 日本語の「許可判定用」の表記正規化を、幅差の同一視と一般的なNFKC互換置換から分離する。`ギア`\
