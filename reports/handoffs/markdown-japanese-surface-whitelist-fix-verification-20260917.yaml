      \nいずれもR81-07の判定とは別である。\n\n## Next action\n\nR81-07を修正し、width-only approval normalizationと互換文字の両方向fixtureを確認する。その後、同じ通常レビュアーでR81-07とCI\
      \ deltaのみfix verificationする。通常レビューが再収束した後に、既存の独立最終レビューライフサイクルへ戻す。mergeはしない。\n"
