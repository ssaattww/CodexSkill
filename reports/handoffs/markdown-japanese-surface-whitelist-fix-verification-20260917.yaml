      - authoritative requirement: PR comment `5704475283`\n\n`daeddaa5...` 以後のcommitはreport/handoffのみで、実装・Skill・設計・workflow・設定に追加変更がないことを確認した。\n\
      \n## 追加要件の確認\n\n- `term: キャプチャー` + `キャプチャー`: allow\n- 同じ許可一覧 + `キャプチャ`: reject\n- `alias: キャプチャ` を明示した隔離fixture: allow\n\
