name: Validate and release ChatGPT worker skills

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "AGENTS.md"
      - "README.md"
      - "skills/**"
      - "shared/**"
      - "design/**"
      - "tasks/**"
      - "reports/**"
      - "scripts/build_chatgpt_worker_skills.py"
      - "scripts/verify_skill_repository.py"
      - ".github/workflows/release-chatgpt-worker-skills.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "README.md"
      - "skills/**"
      - "shared/**"
      - "design/**"
      - "tasks/**"
      - "reports/**"
      - "scripts/build_chatgpt_worker_skills.py"
      - "scripts/verify_skill_repository.py"
      - ".github/workflows/release-chatgpt-worker-skills.yml"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-worker-skills-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    env:
      TARGET_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target HEAD without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate repository Skill architecture and active links
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_skill_repository.py

      - name: Build and verify ChatGPT wrapper and core Skill ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_chatgpt_worker_skills.py \
            --output chatgpt-worker-skills.zip
          python3 -m zipfile -l chatgpt-worker-skills.zip

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-worker-skills-${{ github.run_id }}
          path: chatgpt-worker-skills.zip
          if-no-files-found: error

  publish-rolling-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: chatgpt-worker-skills-latest
    steps:
      - name: Checkout merged main HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download validated ChatGPT Skill ZIP
        uses: actions/download-artifact@v4
        with:
          name: chatgpt-worker-skills-${{ github.run_id }}
          path: release-dist

      - name: Verify downloaded rolling release asset
        shell: bash
        run: |
          set -euo pipefail
          test -f release-dist/chatgpt-worker-skills.zip
          python3 -m zipfile -l release-dist/chatgpt-worker-skills.zip

      - name: Publish rolling GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          git tag -f "${TAG}" "${GITHUB_SHA}"
          git push --force origin "refs/tags/${TAG}"

          notes="Upload chatgpt-worker-skills.zip to ChatGPT Skills. The archive contains ChatGPT runtime wrappers and the parent-independent core Skills they invoke. No Skill depends on repository-external shared files. Repository-wide Skill dependency and active-link validation passed for source commit: ${GITHUB_SHA}."

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "ChatGPT Worker Skills" \
              --notes "${notes}" \
              --latest
          else
            gh release create "${TAG}" \
              --title "ChatGPT Worker Skills" \
              --notes "${notes}" \
              --latest
          fi

          gh release upload \
            "${TAG}" \
            release-dist/chatgpt-worker-skills.zip \
            --clobber

  publish-versioned-prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout merged main HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve incremented prerelease tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          latest_stable_tag=$(git tag --sort=-v:refname | grep -E '^(v)?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [[ -n "${latest_stable_tag}" ]]; then
            base_version="${latest_stable_tag#v}"
            commits_since_base=$(git rev-list --count "${latest_stable_tag}..HEAD")
          else
            base_version="0.1.0"
            commits_since_base=$(git rev-list --count HEAD)
          fi

          if [[ ! "${base_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid base version format: ${base_version}"
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "${base_version}"
          if [[ "${commits_since_base}" -lt 1 ]]; then
            commits_since_base=1
          fi

          next_patch=$((patch + commits_since_base))
          prerelease_tag="${major}.${minor}.${next_patch}-pre"

          if git rev-parse -q --verify "refs/tags/${prerelease_tag}" >/dev/null; then
            echo "Pre-release tag already exists: ${prerelease_tag}"
            exit 1
          fi

          echo "tag=${prerelease_tag}" >> "${GITHUB_OUTPUT}"

      - name: Download validated ChatGPT Skill ZIP
        uses: actions/download-artifact@v4
        with:
          name: chatgpt-worker-skills-${{ github.run_id }}
          path: release-dist

      - name: Verify downloaded prerelease asset
        shell: bash
        run: |
          set -euo pipefail
          test -f release-dist/chatgpt-worker-skills.zip
          python3 -m zipfile -l release-dist/chatgpt-worker-skills.zip

      - name: Publish incremented GitHub Pre-release
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          notes_file=$(mktemp)
          {
            echo "Automated ChatGPT Worker Skills pre-release from main push."
            echo
            echo "Source commit: ${GITHUB_SHA}"
            pr_numbers=$(gh api -H "Accept: application/vnd.github+json" "/repos/${GH_REPO}/commits/${GITHUB_SHA}/pulls" --jq '.[].number' 2>/dev/null || true)
            if [[ -n "${pr_numbers}" ]]; then
              echo
              echo "Related pull requests:"
              while IFS= read -r pr; do
                [[ -z "${pr}" ]] && continue
                echo "- #${pr}"
              done <<< "${pr_numbers}"
            fi
          } > "${notes_file}"

          gh release create "${TAG}" \
            release-dist/chatgpt-worker-skills.zip \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes-file "${notes_file}" \
            --prerelease \
            --latest=false

  attach-published-release-asset:
    if: github.event_name == 'release'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download validated ChatGPT Skill ZIP
        uses: actions/download-artifact@v4
        with:
          name: chatgpt-worker-skills-${{ github.run_id }}
          path: release-dist

      - name: Verify downloaded release asset
        shell: bash
        run: |
          set -euo pipefail
          test -f release-dist/chatgpt-worker-skills.zip
          python3 -m zipfile -l release-dist/chatgpt-worker-skills.zip

      - name: Attach ZIP to published release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload \
            "${TAG}" \
            release-dist/chatgpt-worker-skills.zip \
            --clobber
