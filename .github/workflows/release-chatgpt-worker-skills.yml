name: Validate and release ChatGPT worker skills

on:
  pull_request:
    paths:
      - "skills/chat-*/**"
      - "shared/workflow/**"
      - "shared/chat-worker/**"
      - "scripts/build_chatgpt_worker_skills.py"
      - "design/chat-worker-skill-design.md"
      - "design/skill-hierarchy-design.md"
      - "skills/design/skill-hierarchy-design.md"
      - ".github/workflows/release-chatgpt-worker-skills.yml"
  push:
    branches:
      - main
    paths:
      - "skills/chat-*/**"
      - "shared/workflow/**"
      - "shared/chat-worker/**"
      - "scripts/build_chatgpt_worker_skills.py"
      - "design/chat-worker-skill-design.md"
      - "design/skill-hierarchy-design.md"
      - "skills/design/skill-hierarchy-design.md"
      - ".github/workflows/release-chatgpt-worker-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-worker-skills-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target HEAD without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build and verify complete ChatGPT Skill ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_chatgpt_worker_skills.py \
            --output chatgpt-worker-skills.zip
          python3 -m zipfile -l chatgpt-worker-skills.zip

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-worker-skills-${{ github.sha }}
          path: chatgpt-worker-skills.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download validated ChatGPT Skill ZIP
        uses: actions/download-artifact@v4
        with:
          name: chatgpt-worker-skills-${{ github.sha }}
          path: release-dist

      - name: Verify downloaded release asset
        shell: bash
        run: |
          set -euo pipefail
          test -f release-dist/chatgpt-worker-skills.zip
          python3 -m zipfile -l release-dist/chatgpt-worker-skills.zip

      - name: Publish rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: chatgpt-worker-skills-latest
        shell: bash
        run: |
          set -euo pipefail
          git tag -f "${TAG}" "${GITHUB_SHA}"
          git push --force origin "refs/tags/${TAG}"

          notes="Upload chatgpt-worker-skills.zip to ChatGPT Skills. The archive contains every repository Skill matching skills/chat-*/SKILL.md and all referenced shared runtime dependencies. Source commit: ${GITHUB_SHA}."

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "ChatGPT Worker Skills" \
              --notes "${notes}" \
              --latest
          else
            gh release create "${TAG}" \
              --title "ChatGPT Worker Skills" \
              --notes "${notes}" \
              --latest
          fi

          gh release upload \
            "${TAG}" \
            release-dist/chatgpt-worker-skills.zip \
            --clobber
